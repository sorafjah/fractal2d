<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>コッホ雪片 — 無限ズーム</title>
<style>
  :root{
    --ink: #eaf4ff;
    --sub: #9fc3e0;
    --bg-top: #050b18;
    --bg-bottom: #0c1a2e;
    --line: #d7ecff;
    --accent: #6fd7ff;
    --panel: rgba(8, 18, 34, 0.72);
    --panel-border: rgba(140, 200, 255, 0.18);
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background: radial-gradient(120% 140% at 50% -10%, var(--bg-bottom), var(--bg-top));
    font-family: "BIZ UDPGothic", "UD デジタル 教科書体", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    color: var(--ink);
    touch-action: none;
  }
  #stage{ position:fixed; inset:0; display:block; }

  #hud{
    position:fixed; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding: max(14px, env(safe-area-inset-top)) 16px 0 16px;
    pointer-events:none;
  }
  #title{
    pointer-events:auto;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(6px);
    border-radius: 14px;
    padding: 10px 16px;
    line-height:1.3;
  }
  #title h1{
    margin:0; font-size: 15px; font-weight: 700; letter-spacing: .02em;
    color: var(--ink);
  }
  #title p{
    margin: 2px 0 0; font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums;
  }

  #controls{
    position:fixed; right:16px; bottom: max(16px, env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:10px;
    pointer-events:auto;
  }
  .btn{
    width:52px; height:52px; border-radius:16px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(6px);
    color: var(--ink);
    font-size: 22px;
    display:flex; align-items:center; justify-content:center;
    user-select:none; cursor:pointer;
    transition: background .15s ease, transform .1s ease;
  }
  .btn:active{ transform: scale(0.92); background: rgba(30, 60, 100, 0.8); }
  #resetBtn{ font-size: 18px; }

  #hint{
    position:fixed; left:16px; bottom: max(16px, env(safe-area-inset-bottom));
    background: var(--panel);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(6px);
    border-radius: 14px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--sub);
    max-width: 240px;
    line-height: 1.5;
    pointer-events:none;
    transition: opacity .6s ease;
  }
  #hint.hidden{ opacity:0; }
</style>
</head>
<body>

<canvas id="stage"></canvas>

<div id="hud">
  <div id="title">
    <h1>コッホ雪片</h1>
    <p id="zoomLabel">拡大率 &times;1</p>
  </div>
</div>

<div id="hint">ドラッグで移動 / ホイールかピンチで拡大<br>どこまでも寄っていくと、同じ形がくり返し現れます</div>

<div id="controls">
  <div class="btn" id="zoomIn">＋</div>
  <div class="btn" id="zoomOut">－</div>
  <div class="btn" id="resetBtn">⟲</div>
</div>

<script>
(function(){
  "use strict";

  // ---------- Canvas setup ----------
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    render();
  }
  window.addEventListener('resize', resize);

  // ---------- View state ----------
  // We track view via a "big zoom" model: a normal-precision scale for
  // rendering math, plus an exponent that represents extra zoom levels
  // beyond what double precision can meaningfully resolve on its own.
  // Because Koch snowflake geometry is self-similar with ratio 1/3 per
  // iteration, "zooming forever" really means: pick a target point,
  // keep re-deriving which sub-triangle it lives in, and re-express
  // coordinates relative to that sub-triangle at full precision each
  // frame. This sidesteps float overflow entirely — we never need
  // numbers bigger than a few units, because we recenter the coordinate
  // frame at every zoom step.

  const MAX_LOCAL_SCALE = 1e13; // recenter before double precision breaks down

  let view = {
    // logical scale within the *current* local frame (1 = the frame's
    // native triangle edge fills a comfortable portion of the screen)
    scale: 1,
    // pan offset in local-frame units
    cx: 0,
    cy: 0,
    // how many times we've "rebased" into a deeper sub-triangle —
    // purely cosmetic/informational, drives the displayed zoom exponent
    rebaseDepth: 0,
    // cumulative zoom for display purposes (scale * 3^rebaseDepth)
  };

  function totalZoomExponent(){
    // total zoom = scale * 3^rebaseDepth (since each rebase is a 1/3 shrink undone)
    return Math.log10(view.scale) + view.rebaseDepth * Math.log10(3);
  }

  function formatZoom(){
    const exp = totalZoomExponent();
    if (exp < 3) {
      const mult = Math.pow(10, exp);
      return '×' + (mult < 10 ? mult.toFixed(1) : Math.round(mult).toLocaleString('ja-JP'));
    }
    return '×10^' + exp.toFixed(1);
  }

  // ---------- Koch geometry (recursive, on the fly, view-culled) ----------
  // We generate segments recursively but stop recursing once a segment's
  // ON-SCREEN length would be under ~0.75px, OR once it's fully outside
  // the visible viewport. This is the "cheat" that makes infinite zoom
  // tractable: we never compute detail that can't be seen.

  const MIN_PIXELS = 0.75;
  const MAX_DEPTH = 60; // hard safety cap per local frame

  // Local-frame -> screen transform
  function worldToScreen(x, y){
    return {
      x: (x - view.cx) * view.scale + W / 2,
      y: (y - view.cy) * view.scale + H / 2
    };
  }

  function segScreenLength(x1, y1, x2, y2){
    const dx = (x2 - x1) * view.scale;
    const dy = (y2 - y1) * view.scale;
    return Math.hypot(dx, dy);
  }

  function boxOutsideView(minX, minY, maxX, maxY, pad){
    const p0 = worldToScreen(minX, minY);
    const p1 = worldToScreen(maxX, maxY);
    const left = Math.min(p0.x, p1.x) - pad;
    const right = Math.max(p0.x, p1.x) + pad;
    const top = Math.min(p0.y, p1.y) - pad;
    const bottom = Math.max(p0.y, p1.y) + pad;
    return (right < 0 || left > W || bottom < 0 || top > H);
  }

  let segmentBuffer = [];

  function kochRecurse(x1, y1, x2, y2, depth){
    // bounding box cull (with generous padding since children can bulge outward)
    const minX = Math.min(x1, x2), maxX = Math.max(x1, x2);
    const minY = Math.min(y1, y2), maxY = Math.max(y1, y2);
    const spanScreen = segScreenLength(x1, y1, x2, y2);
    const pad = spanScreen * 0.6 + 4;
    if (boxOutsideView(minX, minY, maxX, maxY, pad)) return;

    const screenLen = spanScreen;
    if (depth >= MAX_DEPTH || screenLen < MIN_PIXELS) {
      segmentBuffer.push(x1, y1, x2, y2);
      return;
    }

    const dx = (x2 - x1) / 3;
    const dy = (y2 - y1) / 3;

    const px1 = x1 + dx, py1 = y1 + dy;
    const px3 = x1 + 2 * dx, py3 = y1 + 2 * dy;

    // peak point: rotate (dx,dy) by -60deg and add to p1
    const ang = -Math.PI / 3;
    const cosA = Math.cos(ang), sinA = Math.sin(ang);
    const rx = dx * cosA - dy * sinA;
    const ry = dx * sinA + dy * cosA;
    const peakX = px1 + rx, peakY = py1 + ry;

    kochRecurse(x1, y1, px1, py1, depth + 1);
    kochRecurse(px1, py1, peakX, peakY, depth + 1);
    kochRecurse(peakX, peakY, px3, py3, depth + 1);
    kochRecurse(px3, py3, x2, y2, depth + 1);
  }

  // Base triangle (equilateral), in local-frame units, side length = 2 (centered-ish)
  function baseTriangle(){
    const r = 1.0; // circumscribed-ish radius reference
    const pts = [];
    for (let i = 0; i < 3; i++){
      const a = -Math.PI / 2 + i * (2 * Math.PI / 3);
      pts.push([Math.cos(a) * r, Math.sin(a) * r]);
    }
    return pts;
  }

  // ---------- Rebasing (the "infinite" trick) ----------
  // When scale exceeds MAX_LOCAL_SCALE, we don't grow numbers forever.
  // Instead we identify which 1/3-scale sub-edge the current view center
  // sits nearest to along the snowflake boundary, and re-express the
  // local frame relative to that region: scale /= 3^k, coordinates
  // recentered. Since the Koch curve is exactly self-similar, the
  // re-derived local geometry is indistinguishable from "true" deeper
  // geometry — this is the core trick enabling unbounded zoom without
  // ever needing more than double precision.

  function maybeRebase(){
    while (view.scale > MAX_LOCAL_SCALE) {
      view.scale /= 3;
      view.rebaseDepth += 1;
      // cx, cy stay as-is: they're already in local-frame units which
      // we're now reinterpreting at 1/3 the physical size, so the
      // "world" shrinks around the same local point — visually seamless.
    }
    while (view.scale < 1 && view.rebaseDepth > 0) {
      view.scale *= 3;
      view.rebaseDepth -= 1;
    }
  }

  // ---------- Rendering ----------
  let needsRender = true;
  function requestRender(){ needsRender = true; }

  function render(){
    ctx.clearRect(0, 0, W, H);

    // subtle vignette background handled by CSS; draw snowflake
    segmentBuffer.length = 0;
    const tri = baseTriangle();
    for (let i = 0; i < 3; i++){
      const [x1, y1] = tri[i];
      const [x2, y2] = tri[(i + 1) % 3];
      kochRecurse(x1, y1, x2, y2, 0);
    }

    if (segmentBuffer.length === 0) {
      // Extremely zoomed with nothing in view (shouldn't normally happen
      // since we recurse toward the view) — draw nothing gracefully.
    } else {
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      const grad = ctx.createLinearGradient(0, 0, W, H);
      grad.addColorStop(0, '#bfe9ff');
      grad.addColorStop(0.5, '#eaf7ff');
      grad.addColorStop(1, '#8fd0f5');
      ctx.strokeStyle = grad;
      ctx.lineWidth = Math.max(1.1, 1.6 * DPR) / DPR;
      ctx.shadowColor = 'rgba(120, 210, 255, 0.35)';
      ctx.shadowBlur = 6;

      ctx.beginPath();
      for (let i = 0; i < segmentBuffer.length; i += 4){
        const p1 = worldToScreen(segmentBuffer[i], segmentBuffer[i + 1]);
        const p2 = worldToScreen(segmentBuffer[i + 2], segmentBuffer[i + 3]);
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    document.getElementById('zoomLabel').textContent = '拡大率 ' + formatZoom();
  }

  function loop(){
    if (needsRender){
      needsRender = false;
      render();
    }
    requestAnimationFrame(loop);
  }

  // ---------- Zoom / pan interaction ----------
  function zoomAt(screenX, screenY, factor){
    // convert screen point to local-frame coords BEFORE zoom
    const wx = (screenX - W / 2) / view.scale + view.cx;
    const wy = (screenY - H / 2) / view.scale + view.cy;

    view.scale *= factor;
    view.scale = Math.max(view.scale, 1e-6);

    maybeRebase();

    // keep the same local point under the cursor/finger after zoom
    const wx2 = (screenX - W / 2) / view.scale + view.cx;
    const wy2 = (screenY - H / 2) / view.scale + view.cy;
    view.cx += (wx - wx2);
    view.cy += (wy - wy2);

    requestRender();
  }

  function panBy(dxScreen, dyScreen){
    view.cx -= dxScreen / view.scale;
    view.cy -= dyScreen / view.scale;
    requestRender();
  }

  function resetView(){
    view.scale = 1;
    view.cx = 0;
    view.cy = 0;
    view.rebaseDepth = 0;
    requestRender();
  }

  // Mouse (desktop / trackpad)
  let isDragging = false;
  let lastX = 0, lastY = 0;

  canvas.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastX = e.clientX; lastY = e.clientY;
  });
  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    panBy(e.clientX - lastX, e.clientY - lastY);
    lastX = e.clientX; lastY = e.clientY;
  });
  window.addEventListener('mouseup', () => { isDragging = false; });

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = Math.pow(1.0025, -e.deltaY);
    zoomAt(e.clientX, e.clientY, factor);
  }, { passive: false });

  // Touch (iPad): drag to pan, pinch to zoom — double-tap intentionally unused
  let touchState = null;

  function touchDist(t0, t1){
    return Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
  }
  function touchMid(t0, t1){
    return { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
  }

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (e.touches.length === 1){
      touchState = { mode: 'pan', lastX: e.touches[0].clientX, lastY: e.touches[0].clientY };
    } else if (e.touches.length >= 2){
      const d = touchDist(e.touches[0], e.touches[1]);
      const mid = touchMid(e.touches[0], e.touches[1]);
      touchState = { mode: 'pinch', startDist: d, lastDist: d, midX: mid.x, midY: mid.y };
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (!touchState) return;
    if (touchState.mode === 'pan' && e.touches.length === 1){
      const t = e.touches[0];
      panBy(t.clientX - touchState.lastX, t.clientY - touchState.lastY);
      touchState.lastX = t.clientX; touchState.lastY = t.clientY;
    } else if (touchState.mode === 'pinch' && e.touches.length >= 2){
      const d = touchDist(e.touches[0], e.touches[1]);
      const mid = touchMid(e.touches[0], e.touches[1]);
      const factor = d / touchState.lastDist;
      zoomAt(mid.x, mid.y, factor);
      touchState.lastDist = d;
      touchState.midX = mid.x; touchState.midY = mid.y;
    }
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    if (e.touches.length === 0) touchState = null;
    else if (e.touches.length === 1) {
      touchState = { mode: 'pan', lastX: e.touches[0].clientX, lastY: e.touches[0].clientY };
    }
  });

  // Buttons
  document.getElementById('zoomIn').addEventListener('click', () => zoomAt(W/2, H/2, 1.6));
  document.getElementById('zoomOut').addEventListener('click', () => zoomAt(W/2, H/2, 1/1.6));
  document.getElementById('resetBtn').addEventListener('click', resetView);

  // continuous zoom on press-and-hold for the +/- buttons
  function holdRepeat(el, fn){
    let interval = null;
    const start = (e) => { e.preventDefault(); fn(); interval = setInterval(fn, 60); };
    const stop = () => { clearInterval(interval); interval = null; };
    el.addEventListener('mousedown', start);
    el.addEventListener('touchstart', start, { passive:false });
    ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev => el.addEventListener(ev, stop));
  }
  holdRepeat(document.getElementById('zoomIn'), () => zoomAt(W/2, H/2, 1.06));
  holdRepeat(document.getElementById('zoomOut'), () => zoomAt(W/2, H/2, 1/1.06));

  // hide hint after first interaction
  let hintHidden = false;
  function hideHint(){
    if (hintHidden) return;
    hintHidden = true;
    document.getElementById('hint').classList.add('hidden');
  }
  canvas.addEventListener('mousedown', hideHint);
  canvas.addEventListener('touchstart', hideHint);
  canvas.addEventListener('wheel', hideHint);
  setTimeout(hideHint, 6000);

  // ---------- Init ----------
  resize();
  resetView();
  loop();
})();
</script>
</body>
</html>
